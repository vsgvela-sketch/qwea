<style>
:root{
  color-scheme:dark;
  --bg:#030202; --text:#cfcfcf; --muted:#6a5f5f; --accent:#b3201f; --line:#241313;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"Courier New",ui-monospace,Menlo,monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;padding:24px;text-align:center;position:relative;
  animation:flick 7s infinite;
}
#noise{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.16;pointer-events:none;z-index:0}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 50%,transparent 25%,rgba(0,0,0,.92) 85%),
             radial-gradient(60% 45% at 50% 110%,rgba(140,10,10,.35),transparent);
  animation:pulse 4.4s ease-in-out infinite}
.eyes{position:fixed;inset:0;pointer-events:none;z-index:1}
.eye{position:absolute;display:flex;gap:14px;opacity:0;animation:look var(--d,6.5s) ease-in-out forwards;filter:drop-shadow(0 0 4px rgba(0,0,0,.95))}
.eye svg{display:block;overflow:visible}
.ir{transition:transform .16s ease-out}
.pu{transform-box:fill-box;transform-origin:center;animation:pup 3.4s ease-in-out infinite}
.lt{animation:lidT var(--d,6.5s) ease-in-out forwards}
.lb{animation:lidB var(--d,6.5s) ease-in-out forwards}
@keyframes pup{50%{transform:scale(1.2)}}
@keyframes look{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes lidT{0%{transform:translateY(0)}13%{transform:translateY(-17px)}36%{transform:translateY(-17px)}39%{transform:translateY(0)}43%{transform:translateY(-17px)}64%{transform:translateY(-17px)}67%{transform:translateY(0)}71%{transform:translateY(-17px)}86%{transform:translateY(-17px)}100%{transform:translateY(0)}}
@keyframes lidB{0%{transform:translateY(0)}13%{transform:translateY(20px)}36%{transform:translateY(20px)}39%{transform:translateY(8px)}43%{transform:translateY(20px)}64%{transform:translateY(20px)}67%{transform:translateY(8px)}71%{transform:translateY(20px)}86%{transform:translateY(20px)}100%{transform:translateY(0)}}

<script>
(function(){
  /* статика */
  var c=document.getElementById('noise'),x=c.getContext('2d'),img=x.createImageData(c.width,c.height);
  function noise(){
    var d=img.data;
    for(var i=0;i<d.length;i+=4){var v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
    x.putImageData(img,0,0);
  }
  noise();setInterval(noise,90);

  /* глаза в темноте */
  var eyes=document.getElementById('eyes'),uid=0,pairs=[],px=null,py=null;
  function eyeSVG(inner){
    var id='e'+(uid++),cx=inner==='r'?92:8;
    return '<svg viewBox="0 0 100 56" width="56" height="31"><defs>'+
    '<clipPath id="'+id+'c"><path d="M3 28Q50 -8 97 28Q50 64 3 28Z"/></clipPath>'+
    '<radialGradient id="'+id+'s" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#c9baac"/><stop offset=".55" stop-color="#86716a"/><stop offset="1" stop-color="#2a1311"/></radialGradient>'+
    '<radialGradient id="'+id+'i" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0a0503"/><stop offset=".35" stop-color="#a0702f"/><stop offset=".7" stop-color="#4a270d"/><stop offset=".92" stop-color="#1a0b04"/><stop offset="1" stop-color="#030100"/></radialGradient>'+
    '<linearGradient id="'+id+'t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".8"/><stop offset=".45" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>'+
    '</defs><g clip-path="url(#'+id+'c)">'+
    '<rect width="100" height="56" fill="url(#'+id+'s)"/>'+
    '<g fill="none" stroke="#8a2222" stroke-opacity=".38" stroke-width=".6" stroke-linecap="round">'+
      '<path d="M4 28C16 26 24 24 32 20"/><path d="M4 29C15 30 24 33 31 37"/><path d="M96 28C84 27 76 25 68 21"/><path d="M96 29C85 31 76 34 69 38"/><path d="M12 27C18 22 22 19 26 14"/><path d="M88 27C82 22 78 19 74 14"/></g>'+
    '<ellipse cx="'+cx+'" cy="30" rx="6" ry="4.5" fill="#8a3a36" fill-opacity=".6"/>'+
    '<g class="ir">'+
      '<circle cx="50" cy="28" r="15" fill="url(#'+id+'i)"/>'+
      '<circle cx="50" cy="28" r="10.5" fill="none" stroke="#e0b068" stroke-opacity=".3" stroke-width="8" stroke-dasharray=".7 1.3"/>'+
      '<circle cx="50" cy="28" r="15" fill="none" stroke="#020100" stroke-width="2.2"/>'+
      '<circle class="pu" cx="50" cy="28" r="6.2" fill="#000"/>'+
      '<ellipse cx="44" cy="22" rx="3.2" ry="2.3" fill="#fff" fill-opacity=".85"/>'+
      '<circle cx="57" cy="34" r="1.3" fill="#fff" fill-opacity=".35"/>'+
    '</g>'+
    '<rect width="100" height="56" fill="url(#'+id+'t)"/>'+
    '<g class="lt"><rect x="-5" y="-14" width="110" height="44" fill="#070303"/><rect x="-5" y="27" width="110" height="3" fill="#2a100d"/></g>'+
    '<g class="lb"><rect x="-5" y="26" width="110" height="40" fill="#090404"/><rect x="-5" y="26" width="110" height="2.5" fill="#2a100d"/></g>'+
    '</g>'+
    '<path d="M3 28Q50 -8 97 28" fill="none" stroke="#050101" stroke-width="3"/>'+
    '<path d="M3 28Q50 64 97 28" fill="none" stroke="#1a0908" stroke-width="1.2"/></svg>';
  }
  function look(p,mx,my){
    var r=p.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=Math.max(-1,Math.min(1,(mx-cx)/(innerWidth*.35))),dy=Math.max(-1,Math.min(1,(my-cy)/(innerHeight*.35)));
    p.irs.forEach(function(g){g.style.transform='translate('+(dx*15).toFixed(1)+'px,'+(dy*5).toFixed(1)+'px)'});
  }
  function makePair(fast){
    var e=document.createElement('div');e.className='eye';
    var s=.7+Math.random()*1.7,dur=fast?3+Math.random()*1.5:5.5+Math.random()*2.5;
    e.style.left=(6+Math.random()*80)+'vw';e.style.top=(6+Math.random()*84)+'vh';
    e.style.setProperty('--d',dur+'s');
    e.style.transform='scale('+s+') rotate('+((Math.random()-.5)*14).toFixed(1)+'deg)';
    if(s<1.1)e.style.filter='blur(.5px) drop-shadow(0 0 4px rgba(0,0,0,.95))';
    e.innerHTML=eyeSVG('r')+eyeSVG('l');
    eyes.appendChild(e);
    var p={el:e,irs:e.querySelectorAll('.ir'),dead:false};pairs.push(p);
    if(px!==null)look(p,px,py);
    (function drift(){
      if(p.dead)return;
      if(px===null){var dx=(Math.random()-.5)*1.1,dy=(Math.random()-.5)*.8;p.irs.forEach(function(g){g.style.transform='translate('+(dx*15).toFixed(1)+'px,'+(dy*5).toFixed(1)+'px)'})}
      setTimeout(drift,900+Math.random()*1800);
    })();
    setTimeout(function(){p.dead=true;pairs.splice(pairs.indexOf(p),1);e.remove()},dur*1000+200);
  }
  function spawn(){
    if(pairs.length>=7){setTimeout(spawn,1500);return}
    makePair();setTimeout(spawn,1100+Math.random()*2400);
  }
  var tick=false;
  document.addEventListener('pointermove',function(ev){
    px=ev.clientX;py=ev.clientY;
    if(tick)return;tick=true;
    requestAnimationFrame(function(){tick=false;pairs.forEach(function(p){look(p,px,py)})});
  },{passive:true});
  setTimeout(spawn,2500);

  /* пыль, угли, фонарь */
  var fx=document.getElementById('fx'),fc=fx.getContext('2d'),light=document.getElementById('light'),W=0,H=0,parts=[],mx=0,my=0,lx=innerWidth/2,ly=innerHeight/2,hasPtr=false,flickTo=0;
  function size(){W=fx.width=innerWidth;H=fx.height=innerHeight}
  size();addEventListener('resize',size);
  function mk(em){return{x:Math.random()*W,y:em?H+Math.random()*60:Math.random()*H,r:em?.8+Math.random()*1.8:.4+Math.random()*1.2,vx:(Math.random()-.5)*.2,vy:em?-(.25+Math.random()*.7):(Math.random()-.5)*.12,a:.15+Math.random()*.5,e:em,ph:Math.random()*6.28}}
  for(var i=0;i<90;i++)parts.push(mk(i%3===0));
  document.addEventListener('pointermove',function(ev){mx=ev.clientX;my=ev.clientY;hasPtr=true},{passive:true});
  function frame(t){
    fc.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){
      var p=parts[i];p.x+=p.vx+Math.sin(t/1500+p.ph)*.15;p.y+=p.vy;
      if(p.y<-10||p.x<-10||p.x>W+10||p.y>H+70){var q=mk(p.e);if(!p.e)q.y=Math.random()*H;parts[i]=q;continue}
      var tw=.6+.4*Math.sin(t/400+p.ph);
      if(p.e){var g=fc.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);g.addColorStop(0,'rgba(255,208,120,'+(p.a*tw)+')');g.addColorStop(1,'rgba(150,95,15,0)');fc.fillStyle=g;fc.beginPath();fc.arc(p.x,p.y,p.r*5,0,6.283);fc.fill()}
      else{fc.fillStyle='rgba(205,195,190,'+(p.a*.35*tw)+')';fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.283);fc.fill()}
    }
    var tx=hasPtr?mx:W/2+Math.sin(t/2300)*W*.18,ty=hasPtr?my:H/2+Math.cos(t/1900)*H*.16;
    lx+=(tx-lx)*.08;ly+=(ty-ly)*.08;
    if(t>flickTo&&Math.random()<.012)flickTo=t+90;
    var r=Math.max(190,Math.min(320,Math.min(W,H)*.46))+Math.sin(t/330)*9;
    if(t<flickTo)r*=.55;
    light.style.setProperty('--mx',lx.toFixed(1)+'px');light.style.setProperty('--my',ly.toFixed(1)+'px');light.style.setProperty('--r',r.toFixed(0)+'px');shadeCheck();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* кровавые капли сверху */
  function drip(){
    var d=document.createElement('div');d.className='drip';var w=2+Math.random()*4;
    d.style.cssText='left:'+(Math.random()*100)+'vw;--w:'+w.toFixed(1)+'px;--h:'+(12+Math.random()*32).toFixed(0)+'vh;--t:'+(5+Math.random()*5).toFixed(1)+'s';
    document.body.appendChild(d);setTimeout(function(){d.remove()},10500);
    setTimeout(drip,2500+Math.random()*5000);
  }
  setTimeout(drip,3500);

  /* лицо, шёпот-надписи, тряска */
  var face=document.getElementById('face'),msg=document.getElementById('msg'),mainEl=document.querySelector('main'),flash=document.getElementById('flash'),blackout=document.getElementById('blackout');
  var crack=document.getElementById('crack'),giant=document.getElementById('giant'),pool=document.getElementById('pool'),beat=document.getElementById('beat'),shade=document.getElementById('shade'),h1=document.querySelector('h1');
  var words=['оглянись','я рядом','ты не один','не смотри','он смотрит','беги','я вижу тебя','ты слышишь?','не оборачивайся','оно за твоей спиной','ты уже здесь','я жду','тише','не закрывай глаза','они знают твоё имя','доверься себе','он внутри','ты не должен был приходить','оно проснулось','кто-то дышит рядом'];
  var scareN=0;
  function fire(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
  function tease(){fire(blackout,'on')}
  function scare(){
    var k=scareN%3;scareN++;
    blackout.classList.remove('on');mainEl.classList.remove('tear');
    fire(mainEl,'shake');
    document.body.classList.add('hot');
    if(k===1){
      document.body.classList.add('flood');
      fire(flash,'on');giant.textContent='я вижу тебя';fire(giant,'on');
      for(var i=0;i<18;i++)setTimeout(function(){makePair(true)},i*70);
      boom();setTimeout(whisper,300);setTimeout(whisper,700);setTimeout(whisper,1100);
      setTimeout(function(){document.body.classList.remove('flood');document.body.classList.remove('hot')},4300);
    }else{
      fire(face,'on');fire(flash,'on');
      if(k===2){fire(crack,'on');setTimeout(boom,260)}
      boom();
      setTimeout(function(){document.body.classList.remove('hot')},1900);
    }
    pool.style.height=Math.min(16,scareN*3)+'vh';
    beat.style.animationDuration=Math.max(.7,1.25-scareN*.1)+'s';
    if(navigator.vibrate)try{navigator.vibrate([220,60,420])}catch(e){}
  }
  function cycle(ms){setTimeout(tease,ms-1800);setTimeout(function(){scare();cycle(30000)},ms)}
  mainEl.addEventListener('animationend',function(e){if(e.target===mainEl)mainEl.classList.remove('tear','shake')});

  function say(t){
    msg.textContent=t||words[Math.floor(Math.random()*words.length)];
    msg.style.top=(12+Math.random()*66)+'vh';
    msg.style.transform='translateX('+((Math.random()-.5)*30).toFixed(1)+'vw) rotate('+((Math.random()-.5)*10).toFixed(1)+'deg)';
    fire(msg,'on');whisper();
  }
  function loop(){say();setTimeout(loop,5000+Math.random()*7000)}

  /* тень в темноте: исчезает, если подойти фонарём */
  var shadeUp=false;
  function summon(){
    setTimeout(summon,20000+Math.random()*18000);
    if(shadeUp)return;
    var wv=shade.offsetWidth/innerWidth*100,lo=3,hi=Math.max(lo,100-wv-3),x=lo+Math.random()*(hi-lo);
    for(var q=0;q<10&&hasPtr&&Math.abs(x*innerWidth/100+shade.offsetWidth/2-mx)<220;q++)x=lo+Math.random()*(hi-lo);
    if(hasPtr&&Math.abs(x*innerWidth/100+shade.offsetWidth/2-mx)<220)return;
    shade.style.left=x+'vw';
    shade.style.transition='opacity 3s';shade.style.opacity=1;shadeUp=true;
    setTimeout(function(){if(shadeUp)banish(false)},10000);
  }
  function banish(near){
    shadeUp=false;shade.style.transition=near?'none':'opacity 1.6s';shade.style.opacity=0;
    if(near){say('слишком поздно');fire(mainEl,'tear');if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}}
  }
  function shadeCheck(){
    if(!shadeUp||!hasPtr)return;
    var r=shade.getBoundingClientRect(),hx=r.left+r.width/2,hy=r.top+r.height*.12;
    if(Math.hypot(mx-hx,my-hy)<Math.max(130,r.width*.9))banish(true);
  }

  /* заголовок портится, сбой экрана, вкладка */
  var orig=h1.textContent,bad=['он здесь','he sees you','trust no one','behind you','не доверяй','run'];
  function corrupt(){
    var t=bad[Math.floor(Math.random()*bad.length)];
    h1.textContent=t;h1.setAttribute('data-text',t);
    setTimeout(function(){h1.textContent=orig;h1.setAttribute('data-text',orig)},140+Math.random()*180);
    setTimeout(corrupt,9000+Math.random()*12000);
  }
  function tearLoop(){if(!mainEl.classList.contains('shake'))fire(mainEl,'tear');setTimeout(tearLoop,6000+Math.random()*9000)}
  var T=document.title;
  document.addEventListener('visibilitychange',function(){document.title=document.hidden?'вернись...':T;if(!document.hidden)setTimeout(function(){say('ты вернулся')},400)});

  cycle(10000);setTimeout(loop,5000);setTimeout(summon,14000);setTimeout(corrupt,7000);setTimeout(tearLoop,6000);

  /* звук */
  var btn=document.getElementById('snd'),ctx=null,master=null,comp=null,nodes=[],timers=[],on=false;
  function osc(type,f,dest,t){var o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.connect(dest);o.start(t||0);nodes.push(o);return o}
  function lfo(rate,depth,param){var l=ctx.createOscillator(),g=ctx.createGain();l.frequency.value=rate;g.gain.value=depth;l.connect(g);g.connect(param);l.start();nodes.push(l)}
  function later(fn,ms){timers.push(setTimeout(fn,ms))}

  function thump(t,v){
    var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(75,t);o.frequency.exponentialRampToValueAtTime(32,t+.18);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.4);
  }
  function heart(){
    if(!on)return;var t=ctx.currentTime+.05;thump(t,.9);thump(t+.28,.6);
    later(heart,1150+Math.random()*250);
  }
  function screech(){
    if(!on)return;
    var t=ctx.currentTime,o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='sawtooth';f.type='bandpass';f.frequency.value=2400;f.Q.value=6;
    var b=1400+Math.random()*1600;
    o.frequency.setValueAtTime(b,t);o.frequency.exponentialRampToValueAtTime(b*1.9,t+1.6);
    var l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=9;lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+2);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.8);g.gain.linearRampToValueAtTime(0,t+1.9);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+2);
    later(screech,7000+Math.random()*12000);
  }
  function creak(){
    if(!on)return;
    var t=ctx.currentTime,o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='square';f.type='bandpass';f.Q.value=10;
    o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(38,t+2.2);
    f.frequency.setValueAtTime(300,t);f.frequency.linearRampToValueAtTime(120,t+2.2);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.5);g.gain.linearRampToValueAtTime(0,t+2.3);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+2.4);
    later(creak,5000+Math.random()*9000);
  }

  function boom(){
    if(!on||!ctx)return;
    var t=ctx.currentTime;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(28,t+1.3);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1.6,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.8);
    o.connect(g);g.connect(comp);o.start(t);o.stop(t+1.9);
    var len=ctx.sampleRate*.9,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var n=ctx.createBufferSource(),ng=ctx.createGain();n.buffer=b;ng.gain.value=1.1;n.connect(ng);ng.connect(comp);n.start(t);
    [880,1180,1670].forEach(function(f,i){
      var s=ctx.createOscillator(),sg=ctx.createGain();s.type='sawtooth';
      s.frequency.setValueAtTime(f,t);s.frequency.exponentialRampToValueAtTime(f*2.6,t+.9);
      var l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=14+i*3;lg.gain.value=60;l.connect(lg);lg.connect(s.frequency);l.start(t);l.stop(t+1.3);
      sg.gain.setValueAtTime(.35,t);sg.gain.exponentialRampToValueAtTime(.001,t+1.2);
      s.connect(sg);sg.connect(comp);s.start(t);s.stop(t+1.3);
    });
  }
  function whisper(){
    if(!on||!ctx)return;
    var t=ctx.currentTime,len=ctx.sampleRate*1.8,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var n=ctx.createBufferSource();n.buffer=b;
    var f1=ctx.createBiquadFilter(),f2=ctx.createBiquadFilter(),g=ctx.createGain();
    f1.type='bandpass';f1.Q.value=8;f2.type='bandpass';f2.Q.value=8;
    f1.frequency.setValueAtTime(500,t);f1.frequency.linearRampToValueAtTime(900,t+.5);f1.frequency.linearRampToValueAtTime(400,t+1.5);
    f2.frequency.setValueAtTime(1800,t);f2.frequency.linearRampToValueAtTime(2600,t+.6);f2.frequency.linearRampToValueAtTime(1500,t+1.5);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(2,t+.3);g.gain.linearRampToValueAtTime(1.1,t+.9);g.gain.linearRampToValueAtTime(0,t+1.7);
    n.connect(f1);n.connect(f2);f1.connect(g);f2.connect(g);
    var pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    if(pan){pan.pan.value=Math.random()*2-1;g.connect(pan);pan.connect(master)}else g.connect(master);
    n.start(t);
  }
  function box(){
    if(!on)return;
    var sc=[659.3,622.3,493.9,415.3,329.6,311.1,246.9],t=ctx.currentTime,k=3+Math.floor(Math.random()*4),dt=.55+Math.random()*.2;
    for(var i=0;i<k;i++){
      var o=ctx.createOscillator(),g=ctx.createGain(),tt=t+i*dt;
      o.type='sine';o.frequency.value=sc[Math.floor(Math.random()*sc.length)]*(1+(Math.random()-.5)*.02);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.09,tt+.01);g.gain.exponentialRampToValueAtTime(.001,tt+1.6);
      o.connect(g);g.connect(master);o.start(tt);o.stop(tt+1.7);
    }
    later(box,6000+Math.random()*7000);
  }
  function knock(){
    if(!on)return;
    var t=ctx.currentTime,k=2+Math.floor(Math.random()*3);
    for(var i=0;i<k;i++){var tt=t+i*(.35+Math.random()*.15),o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      o.type='triangle';o.frequency.setValueAtTime(120,tt);o.frequency.exponentialRampToValueAtTime(45,tt+.12);f.type='lowpass';f.frequency.value=400;
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.9,tt+.005);g.gain.exponentialRampToValueAtTime(.001,tt+.18);
      o.connect(f);f.connect(g);g.connect(master);o.start(tt);o.stop(tt+.25)}
    later(knock,16000+Math.random()*20000);
  }
  function start(){
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    master=ctx.createGain();master.gain.value=0;comp=ctx.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=.002;comp.release.value=.15;master.connect(comp);comp.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(.55,ctx.currentTime+6);

    /* низкий гул с биением */
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;lp.Q.value=4;
    var dg=ctx.createGain();dg.gain.value=.32;lp.connect(dg);dg.connect(master);
    osc('sawtooth',55,lp);osc('sawtooth',58.3,lp);osc('sawtooth',27.5,lp);
    lfo(.06,120,lp.frequency);

    /* диссонанс: тритон и малая секунда, тихо и дрожащее */
    var tg=ctx.createGain();tg.gain.value=.035;tg.connect(master);
    osc('sine',233,tg);osc('sine',329.6,tg);osc('sine',246.9,tg);
    lfo(.13,.025,tg.gain);

    /* ветер / шорох */
    var len=ctx.sampleRate*3,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var ns=ctx.createBufferSource();ns.buffer=buf;ns.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=1.5;
    var ng=ctx.createGain();ng.gain.value=.07;ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start();nodes.push(ns);
    lfo(.09,380,bp.frequency);lfo(.17,.04,ng.gain);

    later(heart,3000);later(screech,9000);later(creak,5000);later(box,2500);later(knock,14000);
  }
  function stop(){
    timers.forEach(clearTimeout);timers=[];
    if(!master)return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(0,ctx.currentTime+1.2);
    var n=nodes;nodes=[];setTimeout(function(){n.forEach(function(o){try{o.stop()}catch(e){}})},1400);
  }
  var userOff=false;
  function setOn(v){
    if(v===on)return;
    on=v;
    try{on?start():stop()}catch(e){on=false}
    btn.setAttribute('aria-pressed',on);
    btn.textContent=on?'❚❚ выключить звук':'▶ включить звук';
  }
  function tryStart(){
    if(on||userOff)return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=ctx||new AC();
      if(ctx.state==='running'){setOn(true);return}
      ctx.resume().then(function(){if(ctx.state==='running')setOn(true)}).catch(function(){});
    }catch(e){}
  }
  btn.addEventListener('click',function(){
    if(on){userOff=true;setOn(false)}else{userOff=false;tryStart()}
  });
  ['pointerdown','pointerup','touchstart','touchend','keydown','wheel','click'].forEach(function(ev){
    document.addEventListener(ev,function(e){if(!btn.contains(e.target))tryStart()},{passive:true});
  });
  tryStart();
})();
</script>
</body>
</html>
